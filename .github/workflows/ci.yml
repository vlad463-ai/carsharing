name: Build and test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'
      - name: Select .NET SDK
        shell: pwsh
        run: dotnet new globaljson --sdk-version 8.0.408 --roll-forward latestPatch
      - name: Install MAUI Windows
        run: dotnet workload install maui-windows
      - name: Build Windows app and test projects
        run: dotnet build CarsharingApp/CarsharingApp.sln -c Release
      - name: Run unit tests
        run: dotnet test CarsharingApp/CarsharingApp.sln -c Release --no-build --filter "TestCategory!=Database" --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: carsharing_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARSHARING_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=carsharing_test;Username=postgres;Password=integration-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore the actual repository schema
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp 'База данных/Carsharing.sql' "$POSTGRES_CONTAINER:/tmp/carsharing.dump"
          docker exec "$POSTGRES_CONTAINER" pg_restore --exit-on-error --schema-only --no-owner --no-privileges -U postgres -d carsharing_test /tmp/carsharing.dump
          docker cp 'База данных/Migrations/001_documents_notifications.sql' "$POSTGRES_CONTAINER:/tmp/features.sql"
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d carsharing_test -f /tmp/features.sql
      - name: Run database regression tests
        run: dotnet test CarsharingApp/CarsharingApp.BookingTests/CarsharingApp.BookingTests.csproj -c Release --filter TestCategory=Database --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-results
          path: '**/TestResults/*.trx'
